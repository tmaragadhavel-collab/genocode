<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Interview report · AI Interview</title>
  <link rel="stylesheet" href="/room-assets/pages.css">
  <style>
    .hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
    .score-xl { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    .score-xl small { font-size: 16px; color: var(--muted); font-weight: 500; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: var(--surface-2); border-radius: 12px; padding: 12px; }
    .stat .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
    .bar > span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
    .qrow { cursor: pointer; }
    .qrow:hover td { background: rgba(255, 255, 255, 0.02); }
    .qdetail td { background: var(--surface-2); }
    .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 4px 0; }
    .detail .full { grid-column: 1 / -1; }
    .answer { white-space: pre-wrap; background: var(--surface); border-radius: 10px; padding: 10px 12px; }
    ul.clist { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    ul.clist li { display: flex; gap: 6px; }
    ul.clist.ok li::before { content: '\2713'; color: var(--success); }
    ul.clist.miss li::before { content: '\25B3'; color: var(--warning); }
    ul.clist.err li::before { content: '\2715'; color: #ff8a8e; }
    ul.clist.plain li::before { content: '\2022'; color: var(--muted); }
    .bd { display: grid; grid-template-columns: 120px 1fr 32px; gap: 8px; align-items: center; font-size: 13px; }
    .transcript { max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .transcript .who { font-size: 12px; font-weight: 600; }
    .saved { font-size: 12px; color: var(--muted); }
    @media (max-width: 800px) { .stats { grid-template-columns: 1fr 1fr; } .detail { grid-template-columns: 1fr; } .hero { grid-template-columns: 1fr; } }
    @media print {
      .topnav, .no-print, button { display: none !important; }
      body { background: #fff; color: #000; }
      .card, .stat { border: 1px solid #ccc; background: #fff; }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/dashboard"><span class="brand-mark" aria-hidden="true"></span>AI Interview</a>
    <div class="nav-right">
      <button class="btn small" onclick="window.print()">Print / save PDF</button>
      <a class="btn small" href="/dashboard">All interviews</a>
    </div>
  </nav>
  <main class="page" id="app">
    <div class="center-state" id="state"><span class="spinner"></span><span id="stateText">Loading report…</span></div>
  </main>
  <script type="module" src="/room-assets/report.js"></script>
</body>
</html>
