<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Interviews · AI Interview</title>
  <link rel="stylesheet" href="/room-assets/pages.css">
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/dashboard"><span class="brand-mark" aria-hidden="true"></span>AI Interview</a>
    <div class="nav-right">
      <span class="muted small hide-sm" id="who"></span>
      <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="btn small" id="logout">Sign out</button>
    </div>
  </nav>
  <main class="page">
    <div class="page-head">
      <div>
        <h1>Interviews</h1>
        <p class="muted">Schedule interviews, share the candidate link, and review reports.</p>
      </div>
      <a class="btn primary" href="/interview/new">+ New interview</a>
    </div>

    <div class="card" id="listCard">
      <div class="center-state" id="loading" style="min-height:160px"><span class="spinner"></span>Loading interviews…</div>
      <div class="center-state" id="empty" style="min-height:160px" hidden>
        <p>No interviews yet.</p>
        <a class="btn primary" href="/interview/new">Schedule your first interview</a>
      </div>
      <div class="notice error" id="loadError" hidden></div>
      <div style="overflow-x:auto"><table class="table" id="table" hidden>
        <thead><tr><th>Candidate</th><th>Position</th><th class="hide-sm">Code</th><th>Status</th><th class="hide-sm">Created</th><th>Score</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch {}
    $('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch {}
    });

    async function load() {
      const resp = await fetch('/api/interviews');
      if (resp.status === 401) { location.replace('/login?next=/dashboard'); return; }
      $('loading').hidden = true;
      if (!resp.ok) {
        $('loadError').hidden = false;
        $('loadError').textContent = 'Could not load interviews. Refresh the page to try again.';
        return;
      }
      const { interviews } = await resp.json();
      if (!interviews.length) { $('empty').hidden = false; return; }
      $('table').hidden = false;
      $('rows').replaceChildren(...interviews.map((iv) => {
        const actions = el('td', { style: 'text-align:right;white-space:nowrap' });
        if (iv.status === 'COMPLETED' || iv.status === 'CANCELLED') {
          if (iv.reportStatus !== 'none') actions.append(el('a', { className: 'btn small primary', href: `/interview/${iv.sessionId}/report` }, 'View report'));
        } else {
          const copy = el('button', { className: 'btn small' }, 'Copy candidate link');
          copy.addEventListener('click', async () => {
            await navigator.clipboard.writeText(iv.candidateUrl).catch(() => prompt('Candidate link', iv.candidateUrl));
            copy.textContent = 'Copied';
            setTimeout(() => { copy.textContent = 'Copy candidate link'; }, 1500);
          });
          actions.append(copy, ' ', el('a', { className: 'btn small primary', href: iv.interviewerUrl }, 'Enter room'));
        }
        const codeCell = el('td', { className: 'hide-sm' });
        if (iv.joinCode && iv.status !== 'COMPLETED' && iv.status !== 'CANCELLED') {
          const codeTxt = el('code', { style: 'font-weight:700;letter-spacing:0.1em;color:var(--accent);cursor:pointer', title: 'Click to copy' }, iv.joinCode);
          codeTxt.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(iv.joinCode); } catch {}
            codeTxt.textContent = 'Copied!';
            setTimeout(() => { codeTxt.textContent = iv.joinCode; }, 1200);
          });
          codeCell.append(codeTxt);
        } else {
          codeCell.append('—');
        }
        return el('tr', {},
          el('td', {}, iv.candidateName),
          el('td', {}, iv.position),
          codeCell,
          el('td', {}, el('span', { className: `pill ${iv.status}` }, iv.status.toLowerCase())),
          el('td', { className: 'hide-sm muted' }, new Date(iv.createdAt).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })),
          el('td', { className: 'num' }, iv.averageScore === null ? '—' : `${iv.averageScore}/100`),
          actions);
      }));
    }

    fetch('/api/auth/me').then((r) => r.json()).then((d) => { if (d.user) $('who').textContent = `${d.user.name} · ${d.user.email}`; }).catch(() => {});
    $('logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.replace('/login');
    });
    load().catch(() => {
      $('loading').hidden = true;
      $('loadError').hidden = false;
      $('loadError').textContent = 'Could not reach the server. Refresh the page to try again.';
    });
  </script>
</body>
</html>
