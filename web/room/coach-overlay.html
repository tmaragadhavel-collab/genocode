<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Coach</title>
  <style>
    :root {
      --bg: #111318;
      --surface: #1a1d24;
      --border: #2a2d35;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #818cf8;
      --accent-dim: rgba(129,140,248,.12);
      --warn: #f59e42;
      --warn-dim: rgba(245,158,66,.12);
      --caution: #ef4444;
      --caution-dim: rgba(239,68,68,.10);
      --radius: 10px;
    }
    :root[data-theme="light"] {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #e2e4e8;
      --text: #18181b;
      --muted: #71717a;
      --accent: #6366f1;
      --accent-dim: rgba(99,102,241,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      user-select: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-height: 44px;
      flex-shrink: 0;
    }
    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .titlebar-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .titlebar-dot.off { background: var(--muted); }
    .titlebar-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .shield {
      font-size: 11px;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      -webkit-app-region: no-drag;
    }
    .titlebar-actions {
      display: flex; gap: 6px;
      -webkit-app-region: no-drag;
    }
    .titlebar-btn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 16px; padding: 2px 6px;
      border-radius: 4px;
    }
    .titlebar-btn:hover { background: var(--border); color: var(--text); }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 24px;
      line-height: 1.6;
    }

    .coach-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }
    .coach-q-label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted);
      margin-bottom: 6px; font-weight: 600;
    }
    .coach-q {
      font-size: 14px; line-height: 1.5;
      margin-bottom: 10px; font-weight: 500;
    }
    .section-label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: .06em; color: var(--accent);
      margin: 12px 0 6px; font-weight: 600;
    }
    .section-label.caution { color: var(--caution); }
    .section-label.warning { color: var(--warn); }
    .section-body {
      font-size: 13px; line-height: 1.6;
      color: var(--text); white-space: pre-wrap;
    }
    .section-body ul { padding-left: 18px; margin: 4px 0; }
    .section-body li { margin-bottom: 4px; }
    .thinking {
      display: flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: 13px;
      padding: 12px 0;
    }
    .thinking-dots span {
      display: inline-block; width: 5px; height: 5px;
      border-radius: 50%; background: var(--accent);
      animation: dot 1.4s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: .2s; }
    .thinking-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

    .status-bar {
      padding: 8px 16px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .kbd { font-size: 10px; opacity: .7; }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="titlebar-dot off" id="statusDot"></div>
      <span class="titlebar-label">AI Coach</span>
    </div>
    <span class="shield" id="shieldBadge">Screen-safe</span>
    <div class="titlebar-actions">
      <button class="titlebar-btn" id="minimizeBtn" title="Minimize">&#x2013;</button>
    </div>
  </div>

  <div class="content" id="coachContent">
    <div class="empty" id="emptyState">
      Waiting for interview to start.<br>
      Coaching will appear here once<br>the interviewer asks a question.
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText">Not connected</span>
    <span class="kbd">Ctrl+Shift+H to hide</span>
  </div>

  <script>
    const content = document.getElementById('coachContent');
    const emptyState = document.getElementById('emptyState');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    if (window.appBridge) {
      window.appBridge.on('COACH_CONTENT', (_ev, data) => {
        if (!data) return;
        if (data.html) {
          emptyState.hidden = true;
          content.innerHTML = data.html;
        } else if (data.clear) {
          emptyState.hidden = false;
          content.innerHTML = '';
          content.appendChild(emptyState);
        }
      });

      window.appBridge.on('COACH_STATUS', (_ev, data) => {
        if (!data) return;
        statusDot.classList.toggle('off', !data.connected);
        statusText.textContent = data.text || (data.connected ? 'Connected' : 'Not connected');
      });

      window.appBridge.on('THEME_CHANGED', (_ev, data) => {
        if (data?.theme) {
          document.documentElement.setAttribute('data-theme', data.theme);
        }
      });

      document.getElementById('minimizeBtn').addEventListener('click', () => {
        window.appBridge.toggleAssistant(false);
      });
    }
  </script>
</body>
</html>
